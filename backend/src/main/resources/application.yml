spring:
  datasource:
    url: jdbc:h2:mem:salarydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
app:
  base-currency: USD
