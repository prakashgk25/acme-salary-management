<div class="dialog-backdrop" (click)="closed.emit()">
  <div class="dialog-card modal-card" role="dialog" aria-modal="true" [attr.aria-label]="mode === 'edit' ? 'Edit employee' : 'Add employee'" (click)="$event.stopPropagation()">

    <div class="modal-head">
      <h2>{{ mode === 'edit' ? 'Edit employee' : 'Add employee' }}</h2>
      <button type="button" class="icon-btn" (click)="closed.emit()" aria-label="Close">×</button>
    </div>

    @if (error()) {
      <div class="form-banner form-banner-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="form-grid">
        <label class="field">
          <span>Employee no.</span>
          <input formControlName="employeeNumber" placeholder="ACME-00001" />
        </label>

        <label class="field">
          <span>First name</span>
          <input formControlName="firstName" placeholder="First name" />
        </label>

        <label class="field">
          <span>Last name</span>
          <input formControlName="lastName" placeholder="Last name" />
        </label>

        <label class="field">
          <span>Department</span>
          <select formControlName="department">
            @for (dept of departments; track dept) {
              <option [value]="dept">{{ dept }}</option>
            }
          </select>
        </label>

        <label class="field">
          <span>Country</span>
          <select formControlName="country" (change)="onCountryChange()">
            @for (option of countries; track option.country) {
              <option [value]="option.country">{{ option.country }}</option>
            }
          </select>
        </label>

        <label class="field">
          <span>Currency</span>
          <select formControlName="currency">
            @for (currency of currencies; track currency) {
              <option [value]="currency">{{ currency }}</option>
            }
          </select>
        </label>

        <label class="field">
          <span>Annual salary</span>
          <input type="number" min="0" step="0.01" formControlName="annualSalary" />
        </label>

        <label class="field">
          <span>Effective date</span>
          <input type="date" formControlName="effectiveDate" />
        </label>
      </div>

      <div class="modal-actions">
        @if (mode === 'edit') {
          <button type="button" class="btn btn-danger-ghost" (click)="requestDelete()">Delete employee</button>
        }
        <div class="modal-actions-right">
          <button type="button" class="btn btn-ghost" (click)="closed.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

@if (confirmingDelete()) {
  <app-confirm-dialog
    title="Delete this employee?"
    [message]="'This will permanently remove ' + (employee?.firstName ?? 'this employee') + ' ' + (employee?.lastName ?? '') + ' from the salary records.'"
    confirmLabel="{{ deleting() ? 'Deleting…' : 'Delete' }}"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
  </app-confirm-dialog>
}
