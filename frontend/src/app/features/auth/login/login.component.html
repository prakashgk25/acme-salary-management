<main class="login-page">
  <section class="login-card">
    <div class="login-mark">ACME</div>
    <h1>Salary Manager</h1>
    <p class="login-subtitle">HR administration portal</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Username</span>
        <input formControlName="username" placeholder="Enter username" autocomplete="username" />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small class="field-error">Username is required.</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" placeholder="Enter password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">Password is required.</small>
        }
      </label>

      @if (error()) {
        <div class="form-banner form-banner-error">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
